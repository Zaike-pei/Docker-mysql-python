version: '3.8'

services:
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      -"3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  
  app:
    build: .
    container_name: python_app
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/app
    command: python main.py

volumes:
  db_data: